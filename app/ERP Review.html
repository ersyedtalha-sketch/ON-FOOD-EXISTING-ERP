<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERP — Design Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="current.jsx"></script>
  <script type="text/babel" src="proposed.jsx"></script>
  <script type="text/babel" src="critiques.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useEffect } = React;

    const ScreenRow = ({ id, title, subtitle, current, proposed, critiqueKey }) => (
      <DCSection id={id} title={title} subtitle={subtitle}>
        <DCArtboard id={`${id}-current`} label="Current — what's shipped" width={1280} height={820}>
          {current}
        </DCArtboard>
        <DCArtboard id={`${id}-proposed`} label="Proposed — neutral admin" width={1280} height={820}>
          {proposed}
        </DCArtboard>
        <DCArtboard id={`${id}-notes`} label="What changed" width={320} height={820}>
          <div style={{
            padding: 20, height: '100%', background: '#fafaf9',
            display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
            overflow: 'auto',
          }}>
            <CritiqueCard {...critiques[critiqueKey]} />
          </div>
        </DCArtboard>
      </DCSection>
    );

    const App = () => (
      <DesignCanvas>
        <ScreenRow
          id="dashboard"
          title="Dashboard — overview"
          subtitle="Where the founder lands. Single screen for the quarter's numbers."
          current={<CurDashboard />}
          proposed={<ProDashboard />}
          critiqueKey="dashboard"
        />
        <ScreenRow
          id="batches"
          title="Batches — production tracker"
          subtitle="Lots produced this month, plus the SKU catalogue."
          current={<CurBatches />}
          proposed={<ProBatches />}
          critiqueKey="batches"
        />
        <ScreenRow
          id="sales"
          title="Sales — invoice history"
          subtitle="Every invoice, what's paid, what's owed."
          current={<CurSales />}
          proposed={<ProSales />}
          critiqueKey="sales"
        />
        <ScreenRow
          id="partners"
          title="Partners — directory"
          subtitle="Retailers and wholesalers ON Food sells to."
          current={<CurPartners />}
          proposed={<ProPartners />}
          critiqueKey="partners"
        />
        <ScreenRow
          id="credit"
          title="Credit ledger — receivables"
          subtitle="Money owed by each partner, oldest first."
          current={<CurCredit />}
          proposed={<ProCredit />}
          critiqueKey="credit"
        />
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
